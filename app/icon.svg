<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Human Resources Outsourced logo</title>
  <desc id="desc">A custom people operations mark with a HRO wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b0a24"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3b0a24" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="#fff8ee"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(16 8) scale(1)">
  <circle cx="34" cy="35" r="10" fill="#db2777"/><circle cx="62" cy="35" r="10" fill="#7c3aed"/>
  <path d="M18 72c3-15 13-23 29-23s26 8 31 23" fill="none" stroke="#fff8ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M48 20v58" stroke="#db2777" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  </g>
  <rect x="18" y="88" width="92" height="25" rx="12.5" fill="rgba(0,0,0,.24)"/>
  <text x="64" y="106" text-anchor="middle" font-family="Inter, Manrope, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-.5" fill="#fff8ee">HRO</text>
</svg>
